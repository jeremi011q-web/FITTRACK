<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101318"><meta name="description" content="Seguimiento de entrenamiento, recuperación y nutrición para Jere y Nicole.">

<style>
:root{color-scheme:dark;--bg:#101318;--panel:#1b2028;--panel2:#232a34;--line:#303946;--muted:#9aa5b2;--text:#f4f6f8;--accent:#b6f36b;--accentText:#17210d;--red:#ff8888;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(82px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:18px 16px 28px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 20px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;background:var(--accent);color:var(--accentText);display:grid;place-items:center;font-size:23px;font-weight:900}
.brand strong{display:block;font-size:18px;letter-spacing:1.2px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:1.4px}.profile{background:var(--panel);border:1px solid var(--line);border-radius:13px;color:var(--text);padding:9px 12px}
.heading{margin:20px 0 14px}.heading h1{font-size:27px;line-height:1.1;margin:0 0 5px}.muted{color:var(--muted)}.small{font-size:12px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--panel);padding:5px;border-radius:15px;margin-bottom:17px}.tab{border:0;background:transparent;color:var(--muted);border-radius:11px;padding:10px 3px;font-size:11px}.tab span{display:block;font-size:17px;margin-bottom:2px}.tab.active{background:var(--accent);color:var(--accentText);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:11px}.metric{min-height:104px}.metric .ico{font-size:19px}.metric .value{font-size:26px;font-weight:750;margin:7px 0 0}.metric .label{font-size:12px;color:var(--muted)}
h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:0 0 9px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.field{display:block;margin:12px 0}.field label{display:block;color:#d8dee6;font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea,input,select,textarea{width:100%;background:#11161d;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent)}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--accent);color:var(--accentText);font-weight:750;width:100%;margin-top:8px}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#442629;color:#ffd9d9}
.pill{font-size:11px;color:var(--accent);background:#29351f;padding:4px 8px;border-radius:30px}.entry{padding:11px 0;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.entry strong{font-size:13px}.entry p{font-size:12px;color:var(--muted);margin:4px 0 0}.empty{color:var(--muted);font-size:13px;padding:12px 0}
.chart{width:100%;height:175px;display:block}.chart text{fill:var(--muted);font-size:10px}.chart .line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart .dot{fill:var(--accent)}
.bottom-note{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}.hidden{display:none!important}.nav{position:fixed;bottom:0;left:0;right:0;background:#151a21ed;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:5}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}.nav button{border:0;background:transparent;color:var(--muted);font-size:9px;padding:4px 0;min-width:0}.nav button span{display:block;font-size:18px}.nav button.active{color:var(--accent)}
.notice{background:#252f20;border:1px solid #465936;border-radius:12px;padding:11px;font-size:12px;color:#d9efc4;margin-bottom:12px}.filebtn{display:block;text-align:center}.filebtn input{display:none}
#auth{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:22px}#auth .authbox{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}#auth h1{margin:0 0 5px;font-size:25px}#auth .muted{font-size:13px}#authError{color:#ff9b9b;font-size:12px;margin-top:10px;white-space:pre-wrap}
#status{font-size:11px;color:var(--muted);margin-top:8px}
.planner-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.planner-switch button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:11px 8px;font-weight:700}
.planner-switch button.active{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.session-card{border:1px solid var(--line);border-radius:13px;padding:12px;margin:10px 0;background:#171c23}
.session-card p{margin:5px 0;color:var(--muted);font-size:12px}
.session-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.session-actions button,.mini-btn{width:auto;margin:0;padding:7px 10px;font-size:12px}
.exercise-row{padding:10px 0;border-bottom:1px solid var(--line)}
.exercise-row:last-child{border-bottom:0}
.badge-status{font-size:10px;padding:4px 7px;border-radius:20px;background:#29351f;color:var(--accent)}
.live-clock{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:8px 0}.set-grid{display:grid;grid-template-columns:42px 1fr 1fr 1fr;gap:7px;align-items:center;margin:8px 0}.set-grid input{min-width:0;padding:9px 6px;text-align:center}.set-head{font-size:10px;color:var(--muted);text-align:center}.timer-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.timer-actions .btn{margin-top:0}.rest-panel{background:#17211a;border:1px solid #3d5630;border-radius:14px;padding:13px;margin-top:12px}.rest-panel.done{background:#2b2418;border-color:#80632c}.rest-mode{display:flex;gap:7px}.rest-mode button{flex:1}.rest-adjust{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.rest-adjust button{margin:0;padding:8px 4px}.rest-status{font-size:12px;color:var(--muted);margin-top:4px}
@media(min-width:650px){.app{padding-top:28px}.heading h1{font-size:32px}}
</style>
</head>
<body>
<div id="auth">
  <div class="authbox">
    <div class="brand"><div class="logo">ƒ</div><div><strong>FITTRACK</strong><div class="eyebrow">PERSONAL PERFORMANCE</div></div></div>
    <h1 style="margin-top:24px">Iniciar sesión</h1>
    <p class="muted">Accede a tus registros personales desde cualquier dispositivo.</p>
    <div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" placeholder="tu correo"></div>
    <div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" placeholder="Tu contraseña"></div>
    <button class="btn" id="login">Entrar</button>
    <div id="authError"></div>
  </div>
</div>
<main class="app" id="app" hidden>
<header class="top"><div class="brand"><div class="logo">ƒ</div><div><strong>FITTRACK</strong><div class="eyebrow">PERSONAL PERFORMANCE</div></div></div>
<div style="display:flex;gap:7px;align-items:center"><select id="profile" class="profile" aria-label="Perfil"></select><button class="profile" id="logout" title="Cerrar sesión">Salir</button></div></header>
<div id="view"></div><div id="status"></div>
<p class="bottom-note">FITTRACK · Datos sincronizados de forma segura en la nube.</p>
</main>
<nav class="nav" id="navwrap" hidden><div class="navin" id="nav">
<button data-tab="home" class="active"><span>⌂</span>Inicio</button><button data-tab="gym"><span>▤</span>Gym</button><button data-tab="recovery"><span>♡</span>Estado</button><button data-tab="nutrition"><span>◉</span>Datos</button><button data-tab="history"><span>▥</span>Historial</button><button data-tab="plans"><span>▣</span>Planes</button>
</div></nav>
<script>
const SUPABASE_URL='https://lkttkjbomwyjfbzdqxpt.supabase.co';
const SUPABASE_KEY='sb_publishable_Tfb_0ukQxq9qSxFm5HWutg_4OEVzU2A';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),today=()=>new Date().toLocaleDateString('en-CA');
let tab='home',data={Jere:[],Nicole:[]},profiles=[],activeProfile=null,user=null,busy=false;
let plannerSport='gym',plannerPlans=[],plannerSessions=[],plannerExercises=[];
let editingSessionId=null,selectedSessionId=null;
let activeWorkout=null,workoutTick=null,restTick=null,sessionSetRows=[],plannerSetRecords=[];
function workoutKey(){return `fittrack-live-${activeProfile?.id||'none'}`}
function restoreWorkout(){try{activeWorkout=JSON.parse(localStorage.getItem(workoutKey())||'null');if(activeWorkout){activeWorkout.rest_mode||='countdown';activeWorkout.rest_target_seconds??=activeWorkout.rest_seconds||0;activeWorkout.rest_elapsed_before??=0;activeWorkout.rest_paused_at??=null}}catch{activeWorkout=null}}
function persistWorkout(){if(activeWorkout)localStorage.setItem(workoutKey(),JSON.stringify(activeWorkout));else localStorage.removeItem(workoutKey())}
function clockText(seconds){seconds=Math.max(0,Math.floor(seconds));return `${String(Math.floor(seconds/3600)).padStart(2,'0')}:${String(Math.floor(seconds%3600/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function restElapsedSeconds(){
 if(!activeWorkout)return 0;
 const base=Number(activeWorkout.rest_elapsed_before||0);
 return Math.max(0,base+(activeWorkout.rest_paused_at?0:(activeWorkout.rest_started_at?((Date.now()-activeWorkout.rest_started_at)/1000):0)));
}
function updateWorkoutClocks(){
 const elapsed=$('#liveElapsed');
 if(elapsed&&activeWorkout){const sec=(activeWorkout.elapsed_before||0)+(activeWorkout.paused_at?0:(Date.now()-activeWorkout.started_at)/1000);elapsed.textContent=clockText(sec)}
 const rest=$('#restElapsed');
 if(rest&&activeWorkout){
   const mode=activeWorkout.rest_mode||'countdown';
   const spent=restElapsedSeconds();
   const target=Number(activeWorkout.rest_target_seconds??activeWorkout.rest_seconds??0);
   const value=mode==='countdown'?Math.max(0,target-spent):spent;
   rest.textContent=clockText(value);
   const done=mode==='countdown'&&target>0&&spent>=target;
   const panel=$('#restPanel');if(panel)panel.classList.toggle('done',done);
   const label=$('#restStatus');if(label)label.textContent=done?'Descanso completado · listo para la siguiente serie':(activeWorkout.rest_paused_at?'Descanso pausado':mode==='countdown'?'Cuenta atrás en curso':'Tiempo de descanso transcurrido');
   if(done&&!activeWorkout.rest_alerted){activeWorkout.rest_alerted=true;persistWorkout();const notice=$('#restNotice');if(notice)notice.hidden=false;if(navigator.vibrate)navigator.vibrate([250,120,250]);}
 }
}
function startWorkoutClock(){clearInterval(workoutTick);workoutTick=setInterval(updateWorkoutClocks,500);updateWorkoutClocks()}
function stopWorkoutClock(){clearInterval(workoutTick);workoutTick=null;clearInterval(restTick);restTick=null}
function who(){return activeProfile?.name||'Jere'}function logs(){return data[who()]||[]}
function status(t){$('#status').textContent=t||''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'})}
function field(label,id,type='text',value='',placeholder=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" placeholder="${placeholder}"></div>`}
function metric(icon,val,label){return `<div class="card metric"><div class="ico">${icon}</div><div class="value">${val}</div><div class="label">${label}</div></div>`}
function entries(list){if(!list.length)return '<div class="empty">Todavía no hay registros.</div>';return list.slice().reverse().slice(0,8).map(x=>`<div class="entry"><div class="row"><strong>${esc(x.type)}</strong><span class="muted small">${fmt(x.date)}</span></div><p>${esc(x.details)}</p></div>`).join('')}
function weightChart(items){if(items.length<2)return '<div class="empty">Registra tu peso al menos dos veces para ver la gráfica.</div>';let a=items.slice(-8),vals=a.map(x=>x.weight),min=Math.min(...vals)-1,max=Math.max(...vals)+1,pts=a.map((x,i)=>`${20+i*260/(a.length-1)},${140-(x.weight-min)/(max-min)*110}`).join(' ');return `<svg class="chart" viewBox="0 0 300 165" role="img" aria-label="Gráfica de evolución del peso"><line x1="20" y1="140" x2="280" y2="140" stroke="#303946"/><polyline class="line" points="${pts}"/>${a.map((x,i)=>`<circle class="dot" cx="${20+i*260/(a.length-1)}" cy="${140-(x.weight-min)/(max-min)*110}" r="3.5"/><text x="${20+i*260/(a.length-1)}" y="158" text-anchor="middle">${fmt(x.date)}</text>`).join('')}</svg>`}
function latest(type){return logs().filter(x=>x.type===type).at(-1)}function getNum(type,regex){let x=latest(type);if(!x)return '—';let m=x.details.match(regex);return m?m[1]:'—'}
function header(title,sub){return `<div class="heading"><h1>${title}</h1><div class="muted small">${esc(who())} · ${sub}</div></div>`}
async function loadProfiles(){
 const {data:m,error:me}=await db.from('profile_memberships').select('profile_id').eq('member_user_id',user.id);
 if(me)throw me;if(!m?.length)throw new Error('Esta cuenta todavía no tiene ningún perfil asignado.');
 const ids=m.map(x=>x.profile_id);
 const {data:p,error:pe}=await db.from('profiles').select('id,name').in('id',ids);
 if(pe)throw pe;profiles=p||[];
 if(!profiles.length)throw new Error('No se encontraron perfiles para esta cuenta.');
 const preferred=profiles.find(x=>x.name==='Jere')||profiles[0];activeProfile=preferred;
 $('#profile').innerHTML=profiles.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
 $('#profile').value=activeProfile.id;
}
async function loadLogs(){
 if(!activeProfile)return;
 status('Sincronizando…');
 const {data:rows,error}=await db.from('activity_logs').select('id,recorded_on,record_type,details,created_at').eq('profile_id',activeProfile.id).order('recorded_on',{ascending:true}).order('created_at',{ascending:true});
 if(error)throw error;
 data[who()]=(rows||[]).map(x=>({id:x.id,date:x.recorded_on,type:x.record_type,details:x.details}));
 status('Sincronizado · '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));
 render();
}
async function add(type,details,date=today()){
 if(busy)return;busy=true;status('Guardando…');
 const {data:row,error}=await db.from('activity_logs').insert({profile_id:activeProfile.id,recorded_on:date,record_type:type,details}).select('id,recorded_on,record_type,details').single();
 busy=false;
 if(error){status('');alert('No se ha podido guardar: '+error.message);return}
 data[who()].push({id:row.id,date:row.recorded_on,type:row.record_type,details:row.details});render();status('Guardado y sincronizado.');
}

async function plannerLoad(){
  if(!activeProfile)return;
  const [plansRes,sessionsRes]=await Promise.all([
    db.from('training_plans').select('*').eq('profile_id',activeProfile.id).eq('sport',plannerSport).order('created_at',{ascending:false}),
    db.from('training_sessions').select('*').eq('profile_id',activeProfile.id).eq('sport',plannerSport).order('session_date',{ascending:false})
  ]);
  if(plansRes.error)throw plansRes.error;
  if(sessionsRes.error)throw sessionsRes.error;
  plannerPlans=plansRes.data||[];
  plannerSessions=sessionsRes.data||[];
  if(selectedSessionId && !plannerSessions.some(x=>x.id===selectedSessionId))selectedSessionId=null;
  if(selectedSessionId)await plannerLoadExercises(selectedSessionId);
  else plannerExercises=[];
}
async function plannerLoadExercises(sessionId){
  const {data,error}=await db.from('training_exercises').select('*').eq('session_id',sessionId).eq('profile_id',activeProfile.id).order('order_index',{ascending:true});
  if(error)throw error;
  plannerExercises=data||[];
  const setsRes=await db.from('training_sets').select('*').eq('session_id',sessionId).eq('profile_id',activeProfile.id).order('set_number',{ascending:true});
  if(setsRes.error)throw setsRes.error;plannerSetRecords=setsRes.data||[];
}
function plannerField(label,id,type='text',placeholder='',value=''){
  return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" value="${esc(value??'')}"></div>`;
}
function plannerSelect(label,id,options,value){
  return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${options.map(x=>`<option value="${x[0]}" ${x[0]===value?'selected':''}>${x[1]}</option>`).join('')}</select></div>`;
}
function plannerRender(v){
  const isGym=plannerSport==='gym';
  const title=isGym?'Planificador de gimnasio':'Planificador de fútbol';
  const session=plannerSessions.find(x=>x.id===selectedSessionId);
  const editing=editingSessionId?plannerSessions.find(x=>x.id===editingSessionId):null;
  const sessionForm=`
    <section class="card"><h2>${editing?'Editar sesión':'Crear sesión'}</h2>
      ${plannerField('Nombre de la sesión','pTitle','text','Ej. Fuerza tren inferior',editing?.title||'')}
      <div class="two">${plannerField('Fecha','pDate','date','',editing?.session_date||today())}${plannerSelect('Estado','pStatus',[['planned','Planificada'],['completed','Completada'],['skipped','No realizada']],editing?.status||'planned')}</div>
      ${plannerField('Objetivo','pObjective','text','Ej. Fuerza máxima / aceleración',editing?.objective||'')}
      <div class="two">${plannerField('Tipo de sesión','pType','text',isGym?'Ej. Fuerza, hipertrofia':'Ej. Técnico-táctica, velocidad',editing?.session_type||'')}${plannerField('Duración (min)','pDuration','number','60',editing?.duration_minutes??'')}</div>
      <div class="two">${plannerField('Distancia total (km)','pDistance','number','Ej. 6.5',editing?.distance_km??'')}${plannerSelect('Intensidad','pIntensity',[['','Sin especificar'],['Baja','Baja'],['Moderada','Moderada'],['Alta','Alta'],['Muy alta','Muy alta']],editing?.intensity||'')}</div>
      <div class="two">${plannerField('RPE de sesión (0–10)','pRpe','number','Ej. 7',editing?.session_rpe??'')}${plannerField('Carga (AU)','pLoad','number','RPE × minutos',editing?.session_load_au??'')}</div>
      <div class="field"><label for="pNotes">Notas</label><textarea id="pNotes" rows="2" placeholder="Indicaciones, sensaciones, contexto...">${esc(editing?.notes||'')}</textarea></div>
      <button class="btn" id="savePlannerSession">${editing?'Guardar cambios':'Crear sesión'}</button>
      ${editing?'<button class="btn secondary" id="cancelPlannerEdit">Cancelar edición</button>':''}
    </section>`;
  const templateForm=`
    <section class="card"><h2>Plantillas de ${isGym?'gimnasio':'fútbol'}</h2>
      <div class="two">${plannerField('Nombre de plantilla','pPlanName','text','Ej. Sesión fuerza A')}${plannerField('Descripción','pPlanDesc','text','Objetivo o contenido')}</div>
      <button class="btn secondary" id="savePlannerTemplate">Guardar plantilla</button>
      ${plannerPlans.length?plannerPlans.map(p=>`<div class="entry"><div class="row"><strong>${esc(p.name)}</strong><button class="mini-btn btn secondary usePlan" data-id="${p.id}">Usar</button></div><p>${esc(p.description||'Sin descripción')}</p><button class="mini-btn btn danger deletePlan" data-id="${p.id}">Eliminar plantilla</button></div>`).join(''):'<div class="empty">Todavía no hay plantillas.</div>'}
    </section>`;
  const sessionList=plannerSessions.length?plannerSessions.map(s=>`
    <div class="session-card">
      <div class="row"><strong>${esc(s.title)}</strong><span class="badge-status">${s.status==='completed'?'Completada':s.status==='skipped'?'No realizada':'Planificada'}</span></div>
      <p>${fmt(s.session_date)} · ${esc(s.session_type||'Sesión')} ${s.duration_minutes?`· ${s.duration_minutes} min`:''} ${s.distance_km?`· ${s.distance_km} km`:''}</p>
      <p>${esc(s.objective||'Sin objetivo')} ${s.session_rpe!==null?`· RPE ${s.session_rpe}`:''}</p>
      <div class="session-actions"><button class="btn secondary mini-btn openSession" data-id="${s.id}">Ver / ejercicios</button><button class="btn secondary mini-btn editSession" data-id="${s.id}">Editar</button><button class="btn danger mini-btn deleteSession" data-id="${s.id}">Eliminar</button></div>
    </div>`).join(''):'<div class="empty">No hay sesiones todavía. Crea la primera arriba.</div>';
  let detail='';
  if(session){

  if(tab==='history'){
 let all=logs().slice().reverse(),weights=logs().filter(x=>x.type==='Nutrición').map(x=>({date:x.date,weight:parseFloat(x.details)})).filter(x=>Number.isFinite(x.weight));
 v.innerHTML=header('Historial','Evolución y gestión de datos')+`<section class="card"><h2>Evolución del peso</h2>${weightChart(weights)}<p class="muted small">Se representa cada peso registrado. Para una tendencia útil, registra el peso en condiciones similares.</p></section><section class="card"><h2>Registros guardados</h2><div class="row"><span class="muted small">${logs().length} registros de ${esc(who())}</span><button class="btn secondary" style="width:auto;margin:0;padding:7px 10px" id="export">Exportar copia</button></div><label class="btn secondary filebtn">Importar copia JSON<input id="import" type="file" accept="application/json"></label><p class="muted small">La importación añade registros al perfil seleccionado.</p></section><section class="card"><h2>Todos los registros</h2>${all.length?all.map(x=>`<div class="entry"><div class="row"><strong>${esc(x.type)}</strong><span class="muted small">${fmt(x.date)}</span></div><p>${esc(x.details)}</p><button class="muted small del" data-id="${x.id}" style="background:none;border:0;padding:5px 0">Eliminar registro</button></div>`).join(''):'<div class="empty">Tu historial aparecerá aquí cuando guardes datos.</div>'}</section><section class="card"><h2>Privacidad y almacenamiento</h2><p class="muted small">Tus registros se guardan en Supabase y solo los usuarios autorizados para este perfil pueden acceder a ellos.</p><button class="btn danger" id="clear">Borrar todos los datos de este perfil</button></section>`;
 $('#export').onclick=()=>{let blob=new Blob([JSON.stringify({profile:who(),records:logs(),exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`fittrack-${who().toLowerCase()}-${today()}.json`;a.click();URL.revokeObjectURL(a.href)};
 $('#import').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j.records))throw Error();let rows=j.records.map(x=>({profile_id:activeProfile.id,recorded_on:x.date||today(),record_type:String(x.type||'Importado'),details:String(x.details||'')}));let {error}=await db.from('activity_logs').insert(rows);if(error)throw error;await loadLogs();alert('Copia importada.')}catch(err){alert('No se ha podido importar: '+(err.message||'archivo no válido'));}};
 document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar este registro?'))return;let {error}=await db.from('activity_logs').delete().eq('id',b.dataset.id).eq('profile_id',activeProfile.id);if(error)return alert('Error al eliminar: '+error.message);data[who()]=logs().filter(x=>String(x.id)!==b.dataset.id);render()});
 $('#clear').onclick=async()=>{if(!confirm('¿Seguro que quieres borrar todos los datos de '+who()+'? Esta acción no se puede deshacer.'))return;let {error}=await db.from('activity_logs').delete().eq('profile_id',activeProfile.id);if(error)return alert('Error: '+error.message);data[who()]=[];render()};
 }
}
async function startApp(){
 const {data:{session},error}=await db.auth.getSession();if(error)throw error;
 if(!session){$('#auth').classList.remove('hidden');$('#app').hidden=true;$('#navwrap').hidden=true;return}
 user=session.user;await loadProfiles();restoreWorkout();$('#auth').classList.add('hidden');$('#app').hidden=false;$('#navwrap').hidden=false;await loadLogs();
  if(tab==='plans')await plannerLoad();
}
$('#login').onclick=async()=>{let email=$('#email').value.trim(),password=$('#password').value;$('#authError').textContent='';if(!email||!password){$('#authError').textContent='Introduce tu correo y contraseña.';return}$('#login').disabled=true;$('#login').textContent='Entrando…';let {error}=await db.auth.signInWithPassword({email,password});$('#login').disabled=false;$('#login').textContent='Entrar';if(error){$('#authError').textContent='No se ha podido iniciar sesión: '+error.message;return}try{await startApp()}catch(e){$('#authError').textContent='Error al cargar FITTRACK: '+e.message}}
$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};
$('#profile').onchange=async()=>{activeProfile=profiles.find(x=>x.id===$('#profile').value);try{await loadLogs();if(tab==='plans')await plannerLoad();render()}catch(e){alert('No se han podido cargar los datos: '+e.message)}};
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',async()=>{tab=b.dataset.tab;if(tab==='plans'){try{await plannerLoad()}catch(e){alert('No se ha podido cargar el planificador: '+e.message)}}render()}));
db.auth.onAuthStateChange((_event,session)=>{if(!session){$('#auth').classList.remove('hidden');$('#app').hidden=true;$('#navwrap').hidden=true}});
(async()=>{try{await startApp()}catch(e){$('#auth').classList.remove('hidden');$('#authError').textContent='Error de conexión/configuración: '+e.message}})();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
