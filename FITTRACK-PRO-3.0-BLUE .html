function workoutKey(){return `fittrack-live-${activeProfile?.id||'none'}`}
function restoreWorkout(){try{activeWorkout=JSON.parse(localStorage.getItem(workoutKey())||'null');if(activeWorkout){activeWorkout.rest_mode||='countdown';activeWorkout.rest_target_seconds??=activeWorkout.rest_seconds||0;activeWorkout.rest_elapsed_before??=0;activeWorkout.rest_paused_at??=null}}catch{activeWorkout=null}}
function persistWorkout(){if(activeWorkout)localStorage.setItem(workoutKey(),JSON.stringify(activeWorkout));else localStorage.removeItem(workoutKey())}
function clockText(seconds){seconds=Math.max(0,Math.floor(seconds));return `${String(Math.floor(seconds/3600)).padStart(2,'0')}:${String(Math.floor(seconds%3600/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function restElapsedSeconds(){
 if(!activeWorkout)return 0;
 const base=Number(activeWorkout.rest_elapsed_before||0);
 return Math.max(0,base+(activeWorkout.rest_paused_at?0:(activeWorkout.rest_started_at?((Date.now()-activeWorkout.rest_started_at)/1000):0)));
}
function updateWorkoutClocks(){
 const elapsed=$('#liveElapsed');

 const rest=$('#restElapsed');
 if(rest&&activeWorkout){
   const mode=activeWorkout.rest_mode||'countdown';
   const spent=restElapsedSeconds();
   const target=Number(activeWorkout.rest_target_seconds??activeWorkout.rest_seconds??0);
   const value=mode==='countdown'?Math.max(0,target-spent):spent;

   const done=mode==='countdown'&&target>0&&spent>=target;
   const panel=$('#restPanel');if(panel)panel.classList.toggle('done',done);
   const label=$('#restStatus');if(label)label.textContent=done?'Descanso completado · listo para la siguiente serie':(activeWorkout.rest_paused_at?'Descanso pausado':mode==='countdown'?'Cuenta atrás en curso':'Tiempo de descanso transcurrido');

function startWorkoutClock(){clearInterval(workoutTick);workoutTick=setInterval(updateWorkoutClocks,500);updateWorkoutClocks()}
function stopWorkoutClock(){clearInterval(workoutTick);workoutTick=null;clearInterval(restTick);restTick=null}
function who(){return activeProfile?.name||'Jere'}function logs(){return data[who()]||[]}
function status(t){$('#status').textContent=t||''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'})}
function field(label,id,type='text',value='',placeholder=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" placeholder="${placeholder}"></div>`}
function metric(icon,val,label){return `<div class="card metric"><div class="ico">${icon}</div><div class="value">${val}</div><div class="label">${label}</div></div>`}
function entries(list){if(!list.length)return '<div class="empty">Todavía no hay registros.</div>';return list.slice().reverse().slice(0,8).map(x=>`<div class="entry"><div class="row"><strong>${esc(x.type)}</strong><span class="muted small">${fmt(x.date)}</span></div><p>${esc(x.details)}</p></div>`).join('')}

function latest(type){return logs().filter(x=>x.type===type).at(-1)}function getNum(type,regex){let x=latest(type);if(!x)return '—';let m=x.details.match(regex);return m?m[1]:'—'}

async function loadProfiles(){
 const {data:m,error:me}=await db.from('profile_memberships').select('profile_id').eq('member_user_id',user.id);
 if(me)throw me;if(!m?.length)throw new Error('Esta cuenta todavía no tiene ningún perfil asignado.');
 const ids=m.map(x=>x.profile_id);
 const {data:p,error:pe}=await db.from('profiles').select('id,name').in('id',ids);
 if(pe)throw pe;profiles=p||[];
 if(!profiles.length)throw new Error('No se encontraron perfiles para esta cuenta.');
 const preferred=profiles.find(x=>x.name==='Jere')||profiles[0];activeProfile=preferred;
 $('#profile').innerHTML=profiles.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
 $('#profile').value=activeProfile.id;
}
async function loadLogs(){
 if(!activeProfile)return;
 status('Sincronizando…');
 const {data:rows,error}=await db.from('activity_logs').select('id,recorded_on,record_type,details,created_at').eq('profile_id',activeProfile.id).order('recorded_on',{ascending:true}).order('created_at',{ascending:true});
 if(error)throw error;
 data[who()]=(rows||[]).map(x=>({id:x.id,date:x.recorded_on,type:x.record_type,details:x.details}));
 status('Sincronizado · '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));
 render();
}
async function add(type,details,date=today()){
 if(busy)return;busy=true;status('Guardando…');
 const {data:row,error}=await db.from('activity_logs').insert({profile_id:activeProfile.id,recorded_on:date,record_type:type,details}).select('id,recorded_on,record_type,details').single();
 busy=false;
 if(error){status('');alert('No se ha podido guardar: '+error.message);return}
 data[who()].push({id:row.id,date:row.recorded_on,type:row.record_type,details:row.details});render();status('Guardado y sincronizado.');
}

async function plannerLoad(){
  if(!activeProfile)return;
  const [plansRes,sessionsRes]=await Promise.all([
    db.from('training_plans').select('*').eq('profile_id',activeProfile.id).eq('sport',plannerSport).order('created_at',{ascending:false}),
    db.from('training_sessions').select('*').eq('profile_id',activeProfile.id).eq('sport',plannerSport).order('session_date',{ascending:false})
  ]);
  if(plansRes.error)throw plansRes.error;
  if(sessionsRes.error)throw sessionsRes.error;
  plannerPlans=plansRes.data||[];
  plannerSessions=sessionsRes.data||[];
  if(selectedSessionId && !plannerSessions.some(x=>x.id===selectedSessionId))selectedSessionId=null;
  if(selectedSessionId)await plannerLoadExercises(selectedSessionId);
  else plannerExercises=[];
}
async function plannerLoadExercises(sessionId){
  const {data,error}=await db.from('training_exercises').select('*').eq('session_id',sessionId).eq('profile_id',activeProfile.id).order('order_index',{ascending:true});
  if(error)throw error;
  plannerExercises=data||[];
  const setsRes=await db.from('training_sets').select('*').eq('session_id',sessionId).eq('profile_id',activeProfile.id).order('set_number',{ascending:true});
  if(setsRes.error)throw setsRes.error;plannerSetRecords=setsRes.data||[];
}

function analyticsEmpty(message){
 return `<div class="analytics-empty">${esc(message)}</div>`;
}
function svgLineChart(points,label,unit=''){
 const valid=points.filter(p=>Number.isFinite(Number(p.value)));
 if(!valid.length)return analyticsEmpty(`Todavía no hay registros suficientes para mostrar ${label.toLowerCase()}.`);
 const W=320,H=178,L=38,R=10,T=12,B=30,plotW=W-L-R,plotH=H-T-B;
 const vals=valid.map(p=>Number(p.value)),lo=Math.min(...vals),hi=Math.max(...vals);
 const pad=(hi-lo)*.16||Math.max(Math.abs(hi)*.04,.5),min=lo-pad,max=hi+pad,span=max-min||1;
 const xy=valid.map((p,i)=>({x:L+(valid.length===1?plotW/2:i*plotW/(valid.length-1)),y:T+plotH-(Number(p.value)-min)/span*plotH,p}));
 const line=xy.map(a=>`${a.x.toFixed(1)},${a.y.toFixed(1)}`).join(' ');
 const area=`${L},${T+plotH} ${line} ${L+plotW},${T+plotH}`;
 const ticks=[0,.5,1].map(f=>{const val=min+(max-min)*f,y=T+plotH-f*plotH;return `<line class="gridline" x1="${L}" y1="${y}" x2="${L+plotW}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${val.toFixed(unit==='kg'?1:1)}</text>`}).join('');
 const dots=xy.map(a=>`<circle class="point" cx="${a.x}" cy="${a.y}" r="4"><title>${esc(a.p.label)}: ${a.p.value} ${esc(unit)}</title></circle>`).join('');
 const labels=valid.length===1?`<text x="${W/2}" y="${H-7}" text-anchor="middle">${esc(valid[0].label)}</text>`:`<text x="${L}" y="${H-7}">${esc(valid[0].label)}</text><text x="${L+plotW}" y="${H-7}" text-anchor="end">${esc(valid.at(-1).label)}</text>`;
 return `<div class="analytics-chart-wrap"><div class="muted small">${esc(label)} · ${esc(unit)}</div><svg class="analytics-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${ticks}<polygon class="area" points="${area}"/><polyline class="trend" points="${line}"/>${dots}${labels}</svg></div>`;
}
function analyticsBars(rows,unit=''){
 const valid=rows.filter(x=>Number.isFinite(Number(x.value)));
 if(!valid.length)return analyticsEmpty('No hay datos registrados para este gráfico en el periodo seleccionado.');
 const max=Math.max(1,...valid.map(x=>Number(x.value)));
 return `<div class="analytics-chart-wrap"><div class="analytics-bars">${valid.map(x=>`<div class="analytics-bar-row"><span>${esc(x.label)}</span><div class="analytics-bar-track"><div class="analytics-bar-fill" style="width:${Math.max(0,Math.min(100,Number(x.value)/max*100))}%"></div></div><b>${Number(x.value).toLocaleString('es-ES',{maximumFractionDigits:1})}${unit?' '+esc(unit):''}</b></div>`).join('')}</div></div>`;
}

function applyLanguage(){
 const lang=currentLang(), roots=[document.querySelector('#app'),document.querySelector('#navwrap'),document.querySelector('#auth')].filter(Boolean);
 if(!roots.length)return;
 document.documentElement.lang=lang;
 const walk=node=>{
  if(node.nodeType===Node.TEXT_NODE){
   const raw=node.nodeValue, trimmed=raw.trim();
   if(!trimmed)return;
   if(lang==='en'&&DICT[trimmed])node.nodeValue=raw.replace(trimmed,DICT[trimmed]);
   else if(lang==='es'){const rev=Object.fromEntries(Object.entries(DICT).map(([a,b])=>[b,a]));if(rev[trimmed])node.nodeValue=raw.replace(trimmed,rev[trimmed]);}
  } else if(node.nodeType===Node.ELEMENT_NODE){
   if(node.tagName==='SCRIPT'||node.tagName==='STYLE')return;
   for(const child of [...node.childNodes])walk(child);
   ['placeholder','title','aria-label'].forEach(attr=>{
    const val=node.getAttribute(attr);if(!val)return;
    if(lang==='en'&&DICT[val])node.setAttribute(attr,DICT[val]);
    if(lang==='es'){const rev=Object.fromEntries(Object.entries(DICT).map(([a,b])=>[b,a]));if(rev[val])node.setAttribute(attr,rev[val]);}
   });
  }
 };
 roots.forEach(walk);
 const b=document.getElementById('languageToggle');if(b){b.textContent=lang==='es'?'EN':'ES';b.title=lang==='es'?'Switch to English':'Cambiar a español';}
}
function logMetric(type,regex,unit=''){
 const a=logs().filter(x=>x.type===type).map(x=>({date:x.date,value:(x.details.match(regex)||[])[1]})).filter(x=>x.value!==undefined&&Number.isFinite(+x.value));
 return a.slice(-8).map(x=>({...x,value:+x.value}));
}
function sparkline(points,label){
 if(points.length<2)return `<div class="empty">${currentLang()==='es'?'Registra al menos dos mediciones para ver la tendencia.':'Log at least two measurements to see a trend.'}</div>`;
 const vals=points.map(x=>x.value),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;
 const coords=vals.map((v,i)=>`${12+i*276/(vals.length-1)},${92-(v-min)/range*72}`).join(' ');
 return `<svg class="mini-chart" viewBox="0 0 300 112" role="img" aria-label="${label}"><line x1="10" y1="94" x2="290" y2="94" stroke="var(--line)"/><polyline points="${coords}"/>${vals.map((v,i)=>`<circle cx="${12+i*276/(vals.length-1)}" cy="${92-(v-min)/range*72}" r="3.5"/>`).join('')}</svg>`;
}
function crossSectionCharts(){
 const en=currentLang()==='en';
 const w=logMetric('Nutrición',/([\d.]+)\s*kg/),sleep=logMetric('Recuperación',/Sueño\s*([\d.]+)/),energy=logMetric('Recuperación',/Energía\s*([\d.]+)/);
 const strength=logs().filter(x=>x.type==='Fuerza').map(x=>{const m=x.details.match(/(\d+(?:\.\d+)?)\s*×\s*(\d+(?:\.\d+)?).*?(\d+(?:\.\d+)?)\s*kg/i);return m?{date:x.date,value:+m[1]*+m[2]*+m[3]}:null}).filter(Boolean).slice(-8);
 const protein=logs().filter(x=>x.type==='Nutrición').map(x=>{const m=x.details.match(/([\d.]+)\s*g\s*prote[ií]na/i);return m?{date:x.date,value:+m[1]}:null}).filter(Boolean).slice(-8);
 const sessions=logs().filter(x=>['Fuerza','Cardio'].includes(x.type)).length;
 const chartCard=(label,value,points,unit)=>`<div class="performance-mini"><small>${label}</small><strong>${value}</strong>${sparkline(points,label)}${unit?`<small>${unit}</small>`:''}</div>`;
 let title=en?'SECTION PERFORMANCE':'RENDIMIENTO DEL APARTADO', heading=en?'Your progress':'Tu evolución', cards=[];
 if(tab==='gym'){
  title=en?'STRENGTH & TRAINING LOAD':'FUERZA Y CARGA DE ENTRENAMIENTO';heading=en?'Training trends':'Tendencias de entrenamiento';
  cards=[chartCard(en?'Last logged volume':'Último volumen registrado',strength.length?Math.round(strength.at(-1).value).toLocaleString()+' kg·reps':'—',strength,en?'kg·reps per logged exercise':'kg·reps por registro'),chartCard(en?'Gym logs':'Registros de gimnasio',String(logs().filter(x=>x.type==='Fuerza').length),strength,en?'Saved strength entries':'Registros de fuerza guardados')];
 } else if(tab==='recovery'){
  title=en?'RECOVERY MONITOR':'CONTROL DE RECUPERACIÓN';heading=en?'Sleep & readiness trends':'Tendencias de sueño y bienestar';
  cards=[chartCard(en?'Latest sleep':'Último sueño',sleep.length?sleep.at(-1).value.toFixed(1)+' h':'—',sleep,'h'),chartCard(en?'Latest energy':'Última energía',energy.length?energy.at(-1).value+'/10':'—',energy,'/10')];
 } else if(tab==='nutrition'){
  title=en?'BODY COMPOSITION & NUTRITION':'COMPOSICIÓN CORPORAL Y NUTRICIÓN';heading=en?'Body metrics trends':'Evolución de medidas';
  cards=[chartCard(en?'Latest weight':'Último peso',w.length?w.at(-1).value.toFixed(1)+' kg':'—',w,'kg'),chartCard(en?'Protein intake':'Ingesta de proteína',protein.length?protein.at(-1).value+' g':'—',protein,'g')];
 } else if(tab==='plans'){
  title=en?'PLAN ADHERENCE':'CUMPLIMIENTO DEL PLAN';heading=en?'Training activity':'Actividad de entrenamiento';
  const gymCount=logs().filter(x=>x.type==='Fuerza').length,cardioCount=logs().filter(x=>x.type==='Cardio').length,maxCount=Math.max(1,gymCount,cardioCount);cards=[`<div class="performance-mini"><small>${en?'Strength sessions logged':'Sesiones de fuerza registradas'}</small><strong>${gymCount}</strong><div class="progress-track"><div class="progress-fill" style="width:${gymCount/maxCount*100}%"></div></div></div>`,`<div class="performance-mini"><small>${en?'Cardio sessions logged':'Sesiones de cardio registradas'}</small><strong>${cardioCount}</strong><div class="progress-track"><div class="progress-fill" style="width:${cardioCount/maxCount*100}%"></div></div></div>`];
 } else if(tab==='history'){
  title=en?'HISTORY AT A GLANCE':'RESUMEN DEL HISTORIAL';heading=en?'Your recorded trends':'Tus tendencias registradas';
  cards=[chartCard(en?'Body weight':'Peso corporal',w.length?w.at(-1).value.toFixed(1)+' kg':'—',w,'kg'),chartCard(en?'Sleep':'Sueño',sleep.length?sleep.at(-1).value.toFixed(1)+' h':'—',sleep,'h')];
 } else {
  title=en?'PROFILE PERFORMANCE':'RENDIMIENTO DEL PERFIL';heading=en?'Your key trends':'Tus tendencias principales';
  cards=[chartCard(en?'Body weight':'Peso corporal',w.length?w.at(-1).value.toFixed(1)+' kg':'—',w,'kg'),chartCard(en?'Sleep':'Sueño',sleep.length?sleep.at(-1).value.toFixed(1)+' h':'—',sleep,'h'),chartCard(en?'Energy':'Energía',energy.length?energy.at(-1).value+'/10':'—',energy,'/10'),`<div class="performance-mini"><small>${en?'Training sessions':'Sesiones de entrenamiento'}</small><strong>${sessions}</strong><small>${en?'Strength and cardio logs':'Registros de fuerza y cardio'}</small></div>`];
 }
 return `<section class="card cross-performance"><div class="section-kicker">${title}</div><h2>${heading}</h2><div class="performance-mini-grid">${cards.join('')}</div><p class="muted small">${en?'Charts use this profile’s saved records only.':'Los gráficos utilizan únicamente los registros guardados en este perfil.'}</p></section>`;
}
const originalRender=render;
render=function(){originalRender();const view=$('#view');if(view&&!['analytics','footballMetrics'].includes(tab)){view.insertAdjacentHTML('beforeend',crossSectionCharts());}applyLanguage();};

async function startApp(){
 const {data:{session},error}=await db.auth.getSession();if(error)throw error;
 if(!session){$('#auth').classList.remove('hidden');$('#app').hidden=true;$('#navwrap').hidden=true;return}
 user=session.user;await loadProfiles();restoreWorkout();$('#auth').classList.add('hidden');$('#app').hidden=false;$('#navwrap').hidden=false;await loadLogs();
  if(tab==='plans')await plannerLoad();render();applyLanguage();if(tab==='nutrition')nutritionLoad();if(tab==='footballMetrics')footballLoad();
}
$('#login').onclick=async()=>{let email=$('#email').value.trim(),password=$('#password').value;$('#authError').textContent='';if(!email||!password){$('#authError').textContent='Introduce tu correo y contraseña.';return}$('#login').disabled=true;$('#login').textContent='Entrando…';let {error}=await db.auth.signInWithPassword({email,password});$('#login').disabled=false;$('#login').textContent='Entrar';if(error){$('#authError').textContent='No se ha podido iniciar sesión: '+error.message;return}try{await startApp()}catch(e){$('#authError').textContent='Error al cargar FITTRACK: '+e.message}}
$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};
$('#languageToggle').onclick=()=>setLang(currentLang()==='es'?'en':'es');
$('#profile').onchange=async()=>{activeProfile=profiles.find(x=>x.id===$('#profile').value);applyLanguage();try{await loadLogs();if(tab==='plans')await plannerLoad();render();if(tab==='nutrition')nutritionLoad();if(tab==='footballMetrics')footballLoad()}catch(e){alert('No se han podido cargar los datos: '+e.message)}};
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',async()=>{tab=b.dataset.tab;if(tab==='plans'){try{await plannerLoad()}catch(e){alert('No se ha podido cargar el planificador: '+e.message)}}render();if(tab==='nutrition')nutritionLoad();if(tab==='footballMetrics')footballLoad()}));

document.addEventListener('click',async e=>{const go=e.target.closest('[data-go]');if(go){tab=go.dataset.go;if(tab==='plans'){try{await plannerLoad()}catch(err){alert(err.message)}}render();if(tab==='nutrition')nutritionLoad();if(tab==='footballMetrics')footballLoad();window.scrollTo({top:0,behavior:'smooth'})}});
const savedTheme=localStorage.getItem('fittrack-theme');if(savedTheme==='light')document.body.classList.add('light');
$('#themeToggle').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('fittrack-theme',document.body.classList.contains('light')?'light':'dark');$('#themeToggle').textContent=document.body.classList.contains('light')?'🌙':'☀️'};
if($('#themeToggle'))$('#themeToggle').textContent=document.body.classList.contains('light')?'🌙':'☀️';
db.auth.onAuthStateChange((_event,session)=>{if(!session){$('#auth').classList.remove('hidden');$('#app').hidden=true;$('#navwrap').hidden=true}});
(async()=>{try{await startApp()}catch(e){$('#auth').classList.remove('hidden');$('#authError').textContent='Error de conexión/configuración: '+e.message}})();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
