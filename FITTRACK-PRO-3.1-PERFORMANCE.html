<script>

const $=s=>document.querySelector(s),today=()=>new Date().toLocaleDateString('en-CA');
let tab='home',data={Jere:[],Nicole:[]},profiles=[],activeProfile=null,user=null,busy=false;

let activeWorkout=null,workoutTick=null,restTick=null,sessionSetRows=[],plannerSetRecords=[];
function workoutKey(){return `fittrack-live-${activeProfile?.id||'none'}`}
function restoreWorkout(){try{activeWorkout=JSON.parse(localStorage.getItem(workoutKey())||'null');if(activeWorkout){activeWorkout.rest_mode||='countdown';activeWorkout.rest_target_seconds??=activeWorkout.rest_seconds||0;activeWorkout.rest_elapsed_before??=0;activeWorkout.rest_paused_at??=null}}catch{activeWorkout=null}}
function persistWorkout(){if(activeWorkout)localStorage.setItem(workoutKey(),JSON.stringify(activeWorkout));else localStorage.removeItem(workoutKey())}
function clockText(seconds){seconds=Math.max(0,Math.floor(seconds));return `${String(Math.floor(seconds/3600)).padStart(2,'0')}:${String(Math.floor(seconds%3600/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function restElapsedSeconds(){
 if(!activeWorkout)return 0;
 const base=Number(activeWorkout.rest_elapsed_before||0);
 return Math.max(0,base+(activeWorkout.rest_paused_at?0:(activeWorkout.rest_started_at?((Date.now()-activeWorkout.rest_started_at)/1000):0)));
}
function updateWorkoutClocks(){
 const elapsed=$('#liveElapsed');
 if(elapsed&&activeWorkout){const sec=(activeWorkout.elapsed_before||0)+(activeWorkout.paused_at?0:(Date.now()-activeWorkout.started_at)/1000);elapsed.textContent=clockText(sec)}
 const rest=$('#restElapsed');
 if(rest&&activeWorkout){
   const mode=activeWorkout.rest_mode||'countdown';
   const spent=restElapsedSeconds();
   const target=Number(activeWorkout.rest_target_seconds??activeWorkout.rest_seconds??0);
   const value=mode==='countdown'?Math.max(0,target-spent):spent;
   rest.textContent=clockText(value);
   const done=mode==='countdown'&&target>0&&spent>=target;
   const panel=$('#restPanel');if(panel)panel.classList.toggle('done',done);
   const label=$('#restStatus');if(label)label.textContent=done?'Descanso completado · listo para la siguiente serie':(activeWorkout.rest_paused_at?'Descanso pausado':mode==='countdown'?'Cuenta atrás en curso':'Tiempo de descanso transcurrido');
   if(done&&!activeWorkout.rest_alerted){activeWorkout.rest_alerted=true;persistWorkout();const notice=$('#restNotice');if(notice)notice.hidden=false;if(navigator.vibrate)navigator.vibrate([250,120,250]);}
 }
}
function startWorkoutClock(){clearInterval(workoutTick);workoutTick=setInterval(updateWorkoutClocks,500);updateWorkoutClocks()}
function stopWorkoutClock(){clearInterval(workoutTick);workoutTick=null;clearInterval(restTick);restTick=null}
function who(){return activeProfile?.name||'Jere'}function logs(){return data[who()]||[]}
function status(t){$('#status').textContent=t||''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'})}
function field(label,id,type='text',value='',placeholder=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" placeholder="${placeholder}"></div>`}
function metric(icon,val,label){return `<div class="card metric"><div class="ico">${icon}</div><div class="value">${val}</div><div class="label">${label}</div></div>`}
function entries(list){if(!list.length)return '<div class="empty">Todavía no hay registros.</div>';return list.slice().reverse().slice(0,8).map(x=>`<div class="entry"><div class="row"><strong>${esc(x.type)}</strong><span class="muted small">${fmt(x.date)}</span></div><p>${esc(x.details)}</p></div>`).join('')}
function weightChart(items){if(items.length<2)return '<div class="empty">Registra tu peso al menos dos veces para ver la gráfica.</div>';let a=items.slice(-8),vals=a.map(x=>x.weight),min=Math.min(...vals)-1,max=Math.max(...vals)+1,pts=a.map((x,i)=>`${20+i*260/(a.length-1)},${140-(x.weight-min)/(max-min)*110}`).join(' ');return `<svg class="chart" viewBox="0 0 300 165" role="img" aria-label="Gráfica de evolución del peso"><line x1="20" y1="140" x2="280" y2="140" stroke="#303946"/><polyline class="line" points="${pts}"/>${a.map((x,i)=>`<circle class="dot" cx="${20+i*260/(a.length-1)}" cy="${140-(x.weight-min)/(max-min)*110}" r="3.5"/><text x="${20+i*260/(a.length-1)}" y="158" text-anchor="middle">${fmt(x.date)}</text>`).join('')}</svg>`}
function latest(type){return logs().filter(x=>x.type===type).at(-1)}function getNum(type,regex){let x=latest(type);if(!x)return '—';let m=x.details.match(regex);return m?m[1]:'—'}
function header(title,sub){return `<div class="heading"><h1>${title}</h1><div class="muted small">${esc(who())} · ${sub}</div></div>`}
async function loadProfiles(){
 const {data:m,error:me}=await db.from('profile_memberships').select('profile_id').eq('member_user_id',user.id);
 if(me)throw me;if(!m?.length)throw new Error('Esta cuenta todavía no tiene ningún perfil asignado.');
 const ids=m.map(x=>x.profile_id);
 const {data:p,error:pe}=await db.from('profiles').select('id,name').in('id',ids);
 if(pe)throw pe;profiles=p||[];
 if(!profiles.length)throw new Error('No se encontraron perfiles para esta cuenta.');
 const preferred=profiles.find(x=>x.name==='Jere')||profiles[0];activeProfile=preferred;
 $('#profile').innerHTML=profiles.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
 $('#profile').value=activeProfile.id;
}
async function loadLogs(){
 if(!activeProfile)return;
 status('Sincronizando…');
 const {data:rows,error}=await db.from('activity_logs').select('id,recorded_on,record_type,details,created_at').eq('profile_id',activeProfile.id).order('recorded_on',{ascending:true}).order('created_at',{ascending:true});
 if(error)throw error;
 data[who()]=(rows||[]).map(x=>({id:x.id,date:x.recorded_on,type:x.record_type,details:x.details}));
 status('Sincronizado · '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));
 render();
}
async function add(type,details,date=today()){
 if(busy)return;busy=true;status('Guardando…');
 const {data:row,error}=await db.from('activity_logs').insert({profile_id:activeProfile.id,recorded_on:date,record_type:type,details}).select('id,recorded_on,record_type,details').single();
 busy=false;
 if(error){status('');alert('No se ha podido guardar: '+error.message);return}
 data[who()].push({id:row.id,date:row.recorded_on,type:row.record_type,details:row.details});render();status('Guardado y sincronizado.');
}

async function plannerLoad(){
  if(!activeProfile)return;
  const [plansRes,sessionsRes]=await Promise.all([
    db.from('training_plans').select('*').eq('profile_id',activeProfile.id).eq('sport',plannerSport).order('created_at',{ascending:false}),
    db.from('training_sessions').select('*').eq('profile_id',activeProfile.id).eq('sport',plannerSport).order('session_date',{ascending:false})
  ]);
  if(plansRes.error)throw plansRes.error;
  if(sessionsRes.error)throw sessionsRes.error;
  plannerPlans=plansRes.data||[];
  plannerSessions=sessionsRes.data||[];
  if(selectedSessionId && !plannerSessions.some(x=>x.id===selectedSessionId))selectedSessionId=null;
  if(selectedSessionId)await plannerLoadExercises(selectedSessionId);
  else plannerExercises=[];
}
async function plannerLoadExercises(sessionId){
  const {data,error}=await db.from('training_exercises').select('*').eq('session_id',sessionId).eq('profile_id',activeProfile.id).order('order_index',{ascending:true});
  if(error)throw error;
  plannerExercises=data||[];
  const setsRes=await db.from('training_sets').select('*').eq('session_id',sessionId).eq('profile_id',activeProfile.id).order('set_number',{ascending:true});
  if(setsRes.error)throw setsRes.error;plannerSetRecords=setsRes.data||[];
}
function plannerField(label,id,type='text',placeholder='',value=''){
  return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" value="${esc(value??'')}"></div>`;
}
function plannerSelect(label,id,options,value){
  return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${options.map(x=>`<option value="${x[0]}" ${x[0]===value?'selected':''}>${x[1]}</option>`).join('')}</select></div>`;
}

      <div class="two">${plannerField('Duración (seg)','eDuration','number','')}${plannerField('Distancia (m)','eDistance','number',isGym?'':'200')}</div>

function analyticsEmpty(message){
 return `<div class="analytics-empty">${esc(message)}</div>`;

function svgLineChart(points,label,unit=''){
 const valid=points.filter(p=>Number.isFinite(Number(p.value)));
 if(!valid.length)return analyticsEmpty(`Todavía no hay registros suficientes para mostrar ${label.toLowerCase()}.`);
 const W=320,H=178,L=38,R=10,T=12,B=30,plotW=W-L-R,plotH=H-T-B;
 const vals=valid.map(p=>Number(p.value)),lo=Math.min(...vals),hi=Math.max(...vals);
 const pad=(hi-lo)*.16||Math.max(Math.abs(hi)*.04,.5),min=lo-pad,max=hi+pad,span=max-min||1;
 const xy=valid.map((p,i)=>({x:L+(valid.length===1?plotW/2:i*plotW/(valid.length-1)),y:T+plotH-(Number(p.value)-min)/span*plotH,p}));
 const line=xy.map(a=>`${a.x.toFixed(1)},${a.y.toFixed(1)}`).join(' ');
 const area=`${L},${T+plotH} ${line} ${L+plotW},${T+plotH}`;
 const ticks=[0,.5,1].map(f=>{const val=min+(max-min)*f,y=T+plotH-f*plotH;return `<line class="gridline" x1="${L}" y1="${y}" x2="${L+plotW}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${val.toFixed(unit==='kg'?1:1)}</text>`}).join('');
 const dots=xy.map(a=>`<circle class="point" cx="${a.x}" cy="${a.y}" r="4"><title>${esc(a.p.label)}: ${a.p.value} ${esc(unit)}</title></circle>`).join('');
 const labels=valid.length===1?`<text x="${W/2}" y="${H-7}" text-anchor="middle">${esc(valid[0].label)}</text>`:`<text x="${L}" y="${H-7}">${esc(valid[0].label)}</text><text x="${L+plotW}" y="${H-7}" text-anchor="end">${esc(valid.at(-1).label)}</text>`;
 return `<div class="analytics-chart-wrap"><div class="muted small">${esc(label)} · ${esc(unit)}</div><svg class="analytics-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${ticks}<polygon class="area" points="${area}"/><polyline class="trend" points="${line}"/>${dots}${labels}</svg></div>`;
}

  <div class="analytics-tile"><small>Tonelaje de gimnasio</small><strong>${Math.round(totalVolume).toLocaleString('es-ES')}</strong><small>kg × repeticiones</small></div>
  <div class="analytics-tile"><small>Carga acumulada</small><strong>${Math.round(sessionLoad).toLocaleString('es-ES')}</strong><small>AU · carga interna</small></div>
  <div class="analytics-tile"><small>Distancia fútbol</small><strong>${distance.toFixed(1)}</strong><small>km registrados</small></div>
  <div class="analytics-tile"><small>Completadas</small><strong>${sessions.length?Math.round(done/sessions.length*100):0}%</strong><small>${gym.length} gym · ${football.length} fútbol</small></div>
 </div>
 <section class="card"><div class="analytics-section-head"><h2>Progresión de fuerza</h2></div>${exerciseNames.length?`<div class="field"><label for="statsExercise">Seleccionar ejercicio</label><select id="statsExercise">${exerciseNames.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></div><div id="exerciseChart">${exerciseChart(selectedName)}</div><p class="analytics-note">Carga real registrada en cada serie. No es una estimación de 1RM.</p>`:analyticsEmpty('Aún no hay series de gimnasio con peso y repeticiones registrados. Registra las series desde Planes → Gimnasio.')}</section>
 <section class="card"><h2>Volumen por ejercicio</h2>${analyticsBars(exerciseVolumeRows,'kg·reps')}<p class="analytics-note">Tonelaje calculado como carga (kg) × repeticiones. Solo incluye series con ambos valores.</p></section>
 <section class="card"><h2>Evolución del peso corporal</h2>${svgLineChart(weightPoints,'Peso corporal','kg')}<p class="analytics-note">Se extrae del peso guardado en Nutrición. Registra mediciones en condiciones similares.</p></section>
 <section class="card"><h2>Seguimiento del sueño</h2>${svgLineChart(recovery,'Horas de sueño','h')}<p class="analytics-note">Horas registradas en Recuperación. No representa una medición de calidad del sueño.</p></section>
 <section class="card"><h2>Carga interna semanal</h2>${weeklyRows.some(x=>x.value>0)?analyticsBars(weeklyRows,'AU'):analyticsEmpty('Registra duración y RPE, o introduce la carga AU, para construir esta gráfica.')}<p class="analytics-note">Se utiliza session_load_au; cuando falta, se calcula RPE × duración en minutos. No equivale a carga GPS.</p></section>
 <section class="card"><h2>Distancia semanal de fútbol</h2>${weeklyDistance.some(x=>x.value>0)?analyticsBars(weeklyDistance,'km'):analyticsEmpty('No hay distancia de fútbol registrada en las sesiones de este periodo.')}</section>
 <section class="card"><h2>Distribución del entrenamiento</h2>${analyticsSportBars(gym.length,football.length)}</section>
 <section class="card"><h2>Resumen del periodo</h2>${sessions.length?`<div class="insight">Has registrado ${sessions.length} sesiones (${gym.length} de gimnasio y ${football.length} de fútbol). ${done} están completadas. El tonelaje registrado es ${Math.round(totalVolume).toLocaleString('es-ES')} kg·repeticiones y la carga interna acumulada es ${Math.round(sessionLoad)} AU.</div>`:analyticsEmpty('No hay sesiones en este periodo. Crea y registra entrenamientos en Planes para activar el análisis.')}</section>`;
 if($('#statsExercise'))$('#statsExercise').onchange=()=>{$('#exerciseChart').innerHTML=exerciseChart($('#statsExercise').value)};
}



// FITTRACK PRO 3.1 — tab-specific performance dashboards, using only saved profile records.
function ft31ParseStrength(){
 return logs().filter(x=>x.type==='Fuerza').map(x=>{
  const m=x.details.match(/·\s*([^·]+?)\s*·\s*(\d+)\s*[×x]\s*(\d+)\s*·\s*([\d.]+)\s*kg/i);
  return m?{date:x.date,exercise:m[1].trim(),sets:+m[2],reps:+m[3],kg:+m[4],volume:+m[2]*+m[3]*+m[4]}:null;
 }).filter(Boolean);
}
function ft31Series(records,key){
 return records.slice(-8).map(x=>({date:x.date,value:+x[key]})).filter(x=>Number.isFinite(x.value));
}
function ft31Metric(label,value,sub=''){
 return `<div class="performance-mini"><small>${label}</small><strong>${value}</strong>${sub?`<div class="muted small">${sub}</div>`:''}</div>`;
}
function ft31Chart(title,records,label){
 return `<section class="card ft31-chart"><div class="row"><h3>${title}</h3><span class="section-kicker">${label||'TREND'}</span></div>${sparkline(records,title)}</section>`;
}
function ft31StrengthChart(){
 const rows=ft31ParseStrength(), names=[...new Set(rows.map(x=>x.exercise))];
 if(!rows.length)return `<section class="card ft31-chart"><h3>${currentLang()==='en'?'Strength progression':'Progresión de fuerza'}</h3><div class="empty">${currentLang()==='en'?'Log strength sets with exercise, sets, reps and load to build your chart.':'Registra ejercicio, series, repeticiones y peso para generar la progresión.'}</div></section>`;
 const selected=names[0], pts=rows.filter(x=>x.exercise===selected).map(x=>({date:x.date,value:x.kg}));
 return `<section class="card ft31-chart"><div class="row"><h3>${currentLang()==='en'?'Strength progression':'Progresión de fuerza'}</h3><span class="pill">${esc(selected)}</span></div>${sparkline(pts,selected)}<div class="muted small">${currentLang()==='en'?'Latest logged load':'Última carga registrada'}: <b>${pts.at(-1).value} kg</b> · ${rows.length} ${currentLang()==='en'?'logged sets':'registros de ejercicio'}</div></section>`;
}
function ft31Visuals(){
 const en=currentLang()==='en', all=logs(), strength=ft31ParseStrength();
 const cardio=all.filter(x=>x.type==='Cardio').map(x=>({date:x.date,details:x.details,mins:+((x.details.match(/([\d.]+)\s*min/i)||[])[1]||0),km:+((x.details.match(/([\d.]+)\s*km/i)||[])[1]||0)}));
 const recovery=all.filter(x=>x.type==='Recuperación');
 const sleep=recovery.map(x=>({date:x.date,value:+((x.details.match(/Sueño\s*([\d.]+)/i)||[])[1]||NaN)})).filter(x=>Number.isFinite(x.value));
 const energy=recovery.map(x=>({date:x.date,value:+((x.details.match(/Energía\s*([\d.]+)/i)||[])[1]||NaN)})).filter(x=>Number.isFinite(x.value));
 const weight=all.filter(x=>x.type==='Nutrición').map(x=>({date:x.date,value:+((x.details.match(/([\d.]+)\s*kg/i)||[])[1]||NaN)})).filter(x=>Number.isFinite(x.value));
 const weekly={}; all.filter(x=>['Fuerza','Cardio'].includes(x.type)).forEach(x=>{const d=new Date(x.date+'T12:00:00'),wk=`${d.getFullYear()}-${String(Math.ceil((((d-new Date(d.getFullYear(),0,1))/86400000)+new Date(d.getFullYear(),0,1).getDay()+1)/7)).padStart(2,'0')}`;weekly[wk]=(weekly[wk]||0)+1});
 const weekPts=Object.entries(weekly).slice(-8).map(([date,value])=>({date,value}));
 const volume=strength.reduce((a,x)=>a+x.volume,0),totalKm=cardio.reduce((a,x)=>a+x.km,0);
 const label=en?'PERFORMANCE OVERVIEW':'RESUMEN DE RENDIMIENTO';
 let body='';
 if(tab==='home'){
  body=`<section class="card ft31-dashboard"><div class="section-kicker">${label}</div><h2>${en?'Your performance at a glance':'Tu rendimiento de un vistazo'}</h2><div class="performance-mini-grid">${ft31Metric(en?'Strength records':'Registros de fuerza',strength.length)}${ft31Metric(en?'Gym volume':'Volumen de gimnasio',Math.round(volume).toLocaleString()+' kg·reps')}${ft31Metric(en?'Cardio distance':'Distancia cardio',totalKm.toFixed(1)+' km')}${ft31Metric(en?'Logged sessions':'Sesiones registradas',all.filter(x=>['Fuerza','Cardio'].includes(x.type)).length)}</div></section>${ft31StrengthChart()}${ft31Chart(en?'Body weight trend':'Evolución del peso',weight,en?'BODY COMPOSITION':'COMPOSICIÓN')}${ft31Chart(en?'Sleep trend':'Evolución del sueño',sleep,en?'RECOVERY':'RECUPERACIÓN')}${ft31Chart(en?'Weekly training frequency':'Frecuencia semanal de entrenamiento',weekPts,en?'CONSISTENCY':'CONSTANCIA')}`;
 }else if(tab==='gym'){
  body=`<section class="card ft31-dashboard"><div class="section-kicker">${label}</div><h2>${en?'Gym performance':'Rendimiento en gimnasio'}</h2><div class="performance-mini-grid">${ft31Metric(en?'Strength entries':'Registros de fuerza',strength.length)}${ft31Metric(en?'Total tonnage':'Tonelaje total',Math.round(volume).toLocaleString()+' kg·reps')}${ft31Metric(en?'Exercises tracked':'Ejercicios registrados',new Set(strength.map(x=>x.exercise)).size)}${ft31Metric(en?'Cardio sessions':'Sesiones de cardio',cardio.length)}</div></section>${ft31StrengthChart()}${ft31Chart(en?'Cardio distance trend':'Evolución de distancia cardio',ft31Series(cardio,'km'),en?'DISTANCE':'DISTANCIA')}`;
 }else if(tab==='recovery'){
  body=`<section class="card ft31-dashboard"><div class="section-kicker">${label}</div><h2>${en?'Recovery trends':'Tendencias de recuperación'}</h2><div class="performance-mini-grid">${ft31Metric(en?'Latest sleep':'Último sueño',sleep.length?sleep.at(-1).value+' h':'—')}${ft31Metric(en?'Latest energy':'Última energía',energy.length?energy.at(-1).value+'/10':'—')}${ft31Metric(en?'Recovery records':'Registros de recuperación',recovery.length)}${ft31Metric(en?'Average sleep':'Media de sueño',sleep.length?(sleep.reduce((a,x)=>a+x.value,0)/sleep.length).toFixed(1)+' h':'—')}</div></section>${ft31Chart(en?'Sleep duration':'Duración del sueño',sleep,en?'HOURS':'HORAS')}${ft31Chart(en?'Energy trend':'Evolución de energía',energy,en?'ENERGY':'ENERGÍA')}`;
 }else if(tab==='nutrition'){
  body=`<section class="card ft31-dashboard"><div class="section-kicker">${label}</div><h2>${en?'Body composition trends':'Tendencias de composición corporal'}</h2><div class="performance-mini-grid">${ft31Metric(en?'Latest weight':'Último peso',weight.length?weight.at(-1).value.toFixed(1)+' kg':'—')}${ft31Metric(en?'Weight entries':'Registros de peso',weight.length)}${ft31Metric(en?'Measurements':'Registros de medidas',all.filter(x=>x.type==='Medidas').length)}${ft31Metric(en?'Nutrition entries':'Registros nutricionales',all.filter(x=>x.type==='Nutrición').length)}</div></section>${ft31Chart(en?'Body weight evolution':'Evolución del peso corporal',weight,en?'WEIGHT':'PESO')}`;
 }else if(tab==='history'){
  body=`<section class="card ft31-dashboard"><div class="section-kicker">${label}</div><h2>${en?'Training history at a glance':'Tu historial de un vistazo'}</h2><div class="performance-mini-grid">${ft31Metric(en?'Total records':'Registros totales',all.length)}${ft31Metric(en?'Strength sessions':'Sesiones de fuerza',all.filter(x=>x.type==='Fuerza').length)}${ft31Metric(en?'Cardio sessions':'Sesiones de cardio',cardio.length)}${ft31Metric(en?'Recovery logs':'Registros de recuperación',recovery.length)}</div></section>${ft31Chart(en?'Weekly activity':'Actividad semanal',weekPts,en?'SESSIONS':'SESIONES')}${ft31Chart(en?'Weight history':'Historial de peso',weight,en?'WEIGHT':'PESO')}`;
 }else if(tab==='plans'){
  body=`<section class="card ft31-dashboard"><div class="section-kicker">${label}</div><h2>${en?'Training consistency':'Constancia de entrenamiento'}</h2><div class="performance-mini-grid">${ft31Metric(en?'Sessions logged':'Sesiones registradas',all.filter(x=>['Fuerza','Cardio'].includes(x.type)).length)}${ft31Metric(en?'Strength volume':'Volumen de fuerza',Math.round(volume).toLocaleString()+' kg·reps')}${ft31Metric(en?'Cardio distance':'Distancia cardio',totalKm.toFixed(1)+' km')}${ft31Metric(en?'Weeks with activity':'Semanas con actividad',weekPts.length)}</div></section>${ft31Chart(en?'Weekly training activity':'Actividad semanal de entrenamiento',weekPts,en?'LOAD FREQUENCY':'FRECUENCIA')}${ft31StrengthChart()}`;
 }else if(tab==='analytics'){
  body=`<section class="card ft31-dashboard"><div class="section-kicker">${label}</div><h2>${en?'Full performance dashboard':'Panel completo de rendimiento'}</h2><div class="performance-mini-grid">${ft31Metric(en?'Strength volume':'Volumen de fuerza',Math.round(volume).toLocaleString()+' kg·reps')}${ft31Metric(en?'Cardio distance':'Distancia cardio',totalKm.toFixed(1)+' km')}${ft31Metric(en?'Recovery entries':'Registros de recuperación',recovery.length)}${ft31Metric(en?'Weight entries':'Registros de peso',weight.length)}</div></section>${ft31StrengthChart()}${ft31Chart(en?'Body weight':'Peso corporal',weight,en?'BODY':'CUERPO')}${ft31Chart(en?'Sleep':'Sueño',sleep,en?'RECOVERY':'RECUPERACIÓN')}${ft31Chart(en?'Weekly activity':'Actividad semanal',weekPts,en?'TRAINING':'ENTRENAMIENTO')}`;
 }
 return body;
}
const originalRender=render;
render=function(){originalRender();const view=$('#view');if(view){view.insertAdjacentHTML('beforeend',ft31Visuals());if(tab!=='analytics')view.insertAdjacentHTML('beforeend',crossSectionCharts());}applyLanguage();};

async function startApp(){
 const {data:{session},error}=await db.auth.getSession();if(error)throw error;
 if(!session){$('#auth').classList.remove('hidden');$('#app').hidden=true;$('#navwrap').hidden=true;return}
 user=session.user;await loadProfiles();restoreWorkout();$('#auth').classList.add('hidden');$('#app').hidden=false;$('#navwrap').hidden=false;await loadLogs();
  if(tab==='plans')await plannerLoad();render();applyLanguage();
}
$('#login').onclick=async()=>{let email=$('#email').value.trim(),password=$('#password').value;$('#authError').textContent='';if(!email||!password){$('#authError').textContent='Introduce tu correo y contraseña.';return}$('#login').disabled=true;$('#login').textContent='Entrando…';let {error}=await db.auth.signInWithPassword({email,password});$('#login').disabled=false;$('#login').textContent='Entrar';if(error){$('#authError').textContent='No se ha podido iniciar sesión: '+error.message;return}try{await startApp()}catch(e){$('#authError').textContent='Error al cargar FITTRACK: '+e.message}}
$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};
$('#languageToggle').onclick=()=>setLang(currentLang()==='es'?'en':'es');
$('#profile').onchange=async()=>{activeProfile=profiles.find(x=>x.id===$('#profile').value);applyLanguage();try{await loadLogs();if(tab==='plans')await plannerLoad();render()}catch(e){alert('No se han podido cargar los datos: '+e.message)}};
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',async()=>{tab=b.dataset.tab;if(tab==='plans'){try{await plannerLoad()}catch(e){alert('No se ha podido cargar el planificador: '+e.message)}}render()}));

document.addEventListener('click',async e=>{const go=e.target.closest('[data-go]');if(go){tab=go.dataset.go;if(tab==='plans'){try{await plannerLoad()}catch(err){alert(err.message)}}render();window.scrollTo({top:0,behavior:'smooth'})}});
const savedTheme=localStorage.getItem('fittrack-theme');if(savedTheme==='light')document.body.classList.add('light');
$('#themeToggle').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('fittrack-theme',document.body.classList.contains('light')?'light':'dark');$('#themeToggle').textContent=document.body.classList.contains('light')?'🌙':'☀️'};
if($('#themeToggle'))$('#themeToggle').textContent=document.body.classList.contains('light')?'🌙':'☀️';
db.auth.onAuthStateChange((_event,session)=>{if(!session){$('#auth').classList.remove('hidden');$('#app').hidden=true;$('#navwrap').hidden=true}});
(async()=>{try{await startApp()}catch(e){$('#auth').classList.remove('hidden');$('#authError').textContent='Error de conexión/configuración: '+e.message}})();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
