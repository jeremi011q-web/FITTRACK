<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101318"><meta name="description" content="Seguimiento de entrenamiento, recuperación y nutrición para Jere y Nicole.">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>FITTRACK</title>
<style>
:root{color-scheme:dark;--bg:#101318;--panel:#1b2028;--panel2:#232a34;--line:#303946;--muted:#9aa5b2;--text:#f4f6f8;--accent:#b6f36b;--accentText:#17210d;--red:#ff8888;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(82px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:18px 16px 28px}.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 20px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;background:var(--accent);color:var(--accentText);display:grid;place-items:center;font-size:23px;font-weight:900}.brand strong{display:block;font-size:18px;letter-spacing:1.2px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:1.4px}.profile{background:var(--panel);border:1px solid var(--line);border-radius:13px;color:var(--text);padding:9px 12px}.heading{margin:20px 0 14px}.heading h1{font-size:27px;line-height:1.1;margin:0 0 5px}.muted{color:var(--muted)}.small{font-size:12px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--panel);padding:5px;border-radius:15px;margin-bottom:17px}.tab{border:0;background:transparent;color:var(--muted);border-radius:11px;padding:10px 3px;font-size:11px}.tab span{display:block;font-size:17px;margin-bottom:2px}.tab.active{background:var(--accent);color:var(--accentText);font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:11px}.metric{min-height:104px}.metric .ico{font-size:19px}.metric .value{font-size:26px;font-weight:750;margin:7px 0 0}.metric .label{font-size:12px;color:var(--muted)}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:0 0 9px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.field{display:block;margin:12px 0}.field label{display:block;color:#d8dee6;font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea,input,select,textarea{width:100%;background:#11161d;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}input[type=range]{padding:0;accent-color:var(--accent)}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--accent);color:var(--accentText);font-weight:750;width:100%;margin-top:8px}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#442629;color:#ffd9d9}.pill{font-size:11px;color:var(--accent);background:#29351f;padding:4px 8px;border-radius:30px}.range-line{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:13px 0 5px}.range-line b{color:var(--accent)}.entry{padding:11px 0;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.entry strong{font-size:13px}.entry p{font-size:12px;color:var(--muted);margin:4px 0 0}.empty{color:var(--muted);font-size:13px;padding:12px 0}.chart{width:100%;height:175px;display:block}.chart text{fill:var(--muted);font-size:10px}.chart .line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart .dot{fill:var(--accent)}.bottom-note{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}.hidden{display:none!important}.nav{position:fixed;bottom:0;left:0;right:0;background:#151a21ed;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:5}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;padding:4px 0}.nav button span{display:block;font-size:18px}.nav button.active{color:var(--accent)}.notice{background:#252f20;border:1px solid #465936;border-radius:12px;padding:11px;font-size:12px;color:#d9efc4;margin-bottom:12px}.filebtn{display:block;text-align:center}.filebtn input{display:none}@media(min-width:650px){.tabs{grid-template-columns:repeat(5,1fr)}.app{padding-top:28px}.heading h1{font-size:32px}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo">ƒ</div><div><strong>FITTRACK</strong><div class="eyebrow">PERSONAL PERFORMANCE</div></div></div><select id="profile" class="profile" aria-label="Perfil"><option>Jere</option><option>Nicole</option></select></header>
<div id="view"></div>
<p class="bottom-note">FITTRACK · Tus datos se guardan en este dispositivo y navegador.</p>
</main>
<nav class="nav"><div class="navin" id="nav"><button data-tab="home" class="active"><span>⌂</span>Inicio</button><button data-tab="gym"><span>▤</span>Gym</button><button data-tab="recovery"><span>♡</span>Estado</button><button data-tab="nutrition"><span>◉</span>Datos</button><button data-tab="history"><span>▥</span>Historial</button></div></nav>
<script>
const $=s=>document.querySelector(s);const today=()=>new Date().toISOString().slice(0,10);const key='fittrack-v1';let tab='home';let data=load();function load(){try{return JSON.parse(localStorage.getItem(key))||{Jere:[],Nicole:[]}}catch{return{Jere:[],Nicole:[]}}}function save(){localStorage.setItem(key,JSON.stringify(data))}function who(){return $('#profile').value}function logs(){return data[who()]||[]}function add(type,details,date=today()){data[who()].push({id:Date.now()+Math.random(),date,type,details});save();render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'})}function field(label,id,type='text',value='',placeholder=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" placeholder="${placeholder}"></div>`}function metric(icon,val,label){return `<div class="card metric"><div class="ico">${icon}</div><div class="value">${val}</div><div class="label">${label}</div></div>`}function entries(list){if(!list.length)return '<div class="empty">Todavía no hay registros.</div>';return list.slice().reverse().slice(0,8).map(x=>`<div class="entry"><div class="row"><strong>${esc(x.type)}</strong><span class="muted small">${fmt(x.date)}</span></div><p>${esc(x.details)}</p></div>`).join('')}function weightChart(items){if(items.length<2)return '<div class="empty">Registra tu peso al menos dos veces para ver la gráfica.</div>';let a=items.slice(-8),vals=a.map(x=>x.weight),min=Math.min(...vals)-1,max=Math.max(...vals)+1,pts=a.map((x,i)=>`${20+i*260/(a.length-1)},${140-(x.weight-min)/(max-min)*110}`).join(' ');return `<svg class="chart" viewBox="0 0 300 165" role="img" aria-label="Gráfica de evolución del peso"><line x1="20" y1="140" x2="280" y2="140" stroke="#303946"/><polyline class="line" points="${pts}"/>${a.map((x,i)=>`<circle class="dot" cx="${20+i*260/(a.length-1)}" cy="${140-(x.weight-min)/(max-min)*110}" r="3.5"/><text x="${20+i*260/(a.length-1)}" y="158" text-anchor="middle">${fmt(x.date)}</text>`).join('')}</svg>`}
function latest(type){return logs().filter(x=>x.type===type).at(-1)}function getNum(type,regex){let x=latest(type);if(!x)return '—';let m=x.details.match(regex);return m?m[1]:'—'}
function header(title,sub){return `<div class="heading"><h1>${title}</h1><div class="muted small">${esc(who())} · ${sub}</div></div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let v=$('#view');if(tab==='home'){let w=getNum('Nutrición',/([\d.]+)\s*kg/),s=getNum('Recuperación',/Sueño\s*([\d.]+)/),work=logs().filter(x=>x.type==='Fuerza'||x.type==='Cardio').length;v.innerHTML=header('Tu actividad','Resumen personal')+`<div class="grid">${metric('⚖️',w==='—'?'—':w+' kg','Último peso')}${metric('☾',s==='—'?'—':s+' h','Último sueño')}${metric('▤',work,'Sesiones registradas')}${metric('✚',logs().length,'Registros totales')}</div><section class="card"><div class="row"><h2>Registro rápido de hoy</h2><span class="pill">${fmt(today())}</span></div><div class="two">${field('Horas de sueño','qsleep','number','','Ej. 8')}${field('Cansancio (1–10)','qfatigue','number','','Ej. 4')}${field('Energía (1–10)','qenergy','number','','Ej. 7')}${field('Estrés (1–10)','qstress','number','','Ej. 3')}</div>${field('Agujetas / dolor muscular (1–10)','qsoreness','number','','Ej. 3')}<button class="btn" id="quickSave">Guardar estado diario</button></section><section class="card"><h2>Actividad reciente</h2>${entries(logs())}</section>`;$('#quickSave').onclick=()=>{let vals=['qsleep','qfatigue','qenergy','qstress','qsoreness'].map(id=>$('#'+id).value);if(vals.some(x=>x===''))return alert('Completa todos los campos.');add('Recuperación',`Sueño ${vals[0]} h · Cansancio ${vals[1]}/10 · Energía ${vals[2]}/10 · Estrés ${vals[3]}/10 · Agujetas ${vals[4]}/10`)}}
if(tab==='gym'){v.innerHTML=header('Entrenamiento','Fuerza y cardio')+`<section class="card"><h2>Registrar fuerza</h2><div class="field"><label>Tipo de sesión</label><select id="gtype"><option>Full Body</option><option>Tren superior</option><option>Tren inferior</option><option>Fútbol</option><option>Otro</option></select></div>${field('Ejercicio','exercise','text','','Ej. Sentadilla') }<div class="three">${field('Series','sets','number','','4')}${field('Repeticiones','reps','number','','8')}${field('Peso (kg)','kg','number','','60')}</div><button class="btn" id="addStrength">Añadir ejercicio</button></section><section class="card"><h2>Registrar cardio</h2><div class="field"><label>Modalidad</label><select id="ctype"><option>Caminata inclinada</option><option>Cinta de correr</option><option>Bicicleta</option><option>Elíptica</option><option>Intervalos</option><option>Caminata exterior</option><option>Fútbol</option></select></div><div class="two">${field('Duración (min)','mins','number','','25')}${field('Distancia (km), opcional','dist','number','','2.5')}</div><button class="btn" id="addCardio">Añadir cardio</button></section><section class="card"><h2>Entrenamientos recientes</h2>${entries(logs().filter(x=>x.type==='Fuerza'||x.type==='Cardio'))}</section>`;$('#addStrength').onclick=()=>{let e=$('#exercise').value.trim(),s=$('#sets').value,r=$('#reps').value,k=$('#kg').value;if(!e||!s||!r||!k)return alert('Completa ejercicio, series, repeticiones y peso.');add('Fuerza',`${$('#gtype').value} · ${e} · ${s} × ${r} · ${k} kg`)};$('#addCardio').onclick=()=>{let m=$('#mins').value;if(!m||+m<=0)return alert('Introduce una duración válida.');add('Cardio',`${$('#ctype').value} · ${m} min${$('#dist').value?' · '+$('#dist').value+' km':''}`)}}
if(tab==='recovery'){v.innerHTML=header('Recuperación','Sueño y bienestar')+`<section class="card"><h2>Control diario</h2><div class="two">${field('Horas de sueño','rsleep','number','','Ej. 7.5')}${field('Calidad del sueño (1–10)','rquality','number','','Ej. 8')}${field('Cansancio (1–10)','rfatigue','number','','Ej. 4')}${field('Energía (1–10)','renergy','number','','Ej. 7')}${field('Estrés (1–10)','rstress','number','','Ej. 3')}${field('Agujetas (1–10)','rsoreness','number','','Ej. 3')}</div>${field('Molestias o notas','rnotes','text','','Ej. piernas cargadas')}<button class="btn" id="saveRecovery">Guardar recuperación</button></section><section class="card"><h2>Historial de recuperación</h2>${entries(logs().filter(x=>x.type==='Recuperación'))}</section>`;$('#saveRecovery').onclick=()=>{let ids=['rsleep','rquality','rfatigue','renergy','rstress','rsoreness'];let a=ids.map(id=>$('#'+id).value);if(a.some(x=>x===''||!Number.isFinite(+x)))return alert('Completa los seis valores.');if(a.slice(1).some(x=>+x<1||+x>10))return alert('Las escalas deben estar entre 1 y 10.');add('Recuperación',`Sueño ${a[0]} h · Calidad ${a[1]}/10 · Cansancio ${a[2]}/10 · Energía ${a[3]}/10 · Estrés ${a[4]}/10 · Agujetas ${a[5]}/10 · ${$('#rnotes').value}`)}}
if(tab==='nutrition'){v.innerHTML=header('Nutrición y medidas','Composición corporal')+`<section class="card"><h2>Registro nutricional</h2><div class="two">${field('Peso (kg)','nweight','number','','Ej. 72.5')}${field('Calorías (kcal)','ncal','number','','Ej. 2000')}${field('Proteína (g)','nprotein','number','','Ej. 130')}${field('Agua (litros)','nwater','number','','Ej. 2')}</div><button class="btn" id="saveNutrition">Guardar nutrición</button></section><section class="card"><h2>Medidas corporales</h2><div class="two">${field('Cintura (cm)','waist','number','','Ej. 80')}${field('Cadera (cm)','hip','number','','Ej. 100')}${field('Muslo (cm)','thigh','number','','Ej. 55')}${field('Brazo (cm)','arm','number','','Ej. 29')}</div><button class="btn" id="saveMeasures">Guardar medidas</button></section><section class="card"><h2>Últimos registros</h2>${entries(logs().filter(x=>x.type==='Nutrición'||x.type==='Medidas'))}</section>`;$('#saveNutrition').onclick=()=>{let a=['nweight','ncal','nprotein','nwater'].map(id=>$('#'+id).value);if(a.some(x=>x===''))return alert('Completa los cuatro campos.');add('Nutrición',`${a[0]} kg · ${a[1]} kcal · ${a[2]} g proteína · ${a[3]} L agua`)};$('#saveMeasures').onclick=()=>{let a=['waist','hip','thigh','arm'].map(id=>$('#'+id).value);if(a.every(x=>x===''))return alert('Introduce al menos una medida.');add('Medidas',`Cintura ${a[0]||'—'} cm · Cadera ${a[1]||'—'} cm · Muslo ${a[2]||'—'} cm · Brazo ${a[3]||'—'} cm`)}}
if(tab==='history'){let all=logs().slice().reverse();let weights=logs().filter(x=>x.type==='Nutrición').map(x=>({date:x.date,weight:parseFloat(x.details)})).filter(x=>Number.isFinite(x.weight));v.innerHTML=header('Historial','Evolución y gestión de datos')+`<section class="card"><h2>Evolución del peso</h2>${weightChart(weights)}<p class="muted small">Se representa cada peso registrado. Para una tendencia útil, registra el peso en condiciones similares.</p></section><section class="card"><h2>Registros guardados</h2><div class="row"><span class="muted small">${logs().length} registros de ${esc(who())}</span><button class="btn secondary" style="width:auto;margin:0;padding:7px 10px" id="export">Exportar copia</button></div><label class="btn secondary filebtn">Importar copia JSON<input id="import" type="file" accept="application/json"></label><p class="muted small">Exporta una copia periódicamente. La importación añade los registros al perfil seleccionado.</p></section><section class="card"><h2>Todos los registros</h2>${all.length?all.map(x=>`<div class="entry"><div class="row"><strong>${esc(x.type)}</strong><span class="muted small">${fmt(x.date)}</span></div><p>${esc(x.details)}</p><button class="muted small del" data-id="${x.id}" style="background:none;border:0;padding:5px 0">Eliminar registro</button></div>`).join(''):'<div class="empty">Tu historial aparecerá aquí cuando guardes datos.</div>'}</section><section class="card"><h2>Privacidad y almacenamiento</h2><p class="muted small">Los datos se guardan en el almacenamiento local de este navegador. No hay cuenta ni sincronización automática. Si borras los datos del navegador o cambias de dispositivo, puedes perderlos. Utiliza Exportar copia para conservarlos.</p><button class="btn danger" id="clear">Borrar todos los datos de este perfil</button></section>`;$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({profile:who(),records:logs(),exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`fittrack-${who().toLowerCase()}-${today()}.json`;a.click();URL.revokeObjectURL(a.href)};$('#import').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j.records))throw Error();data[who()].push(...j.records.map(x=>({...x,id:Date.now()+Math.random()})));save();render();alert('Copia importada.')}catch{alert('No se ha podido leer el archivo.')}};document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este registro?')){data[who()]=logs().filter(x=>String(x.id)!==b.dataset.id);save();render()}});$('#clear').onclick=()=>{if(confirm('¿Seguro que quieres borrar todos los datos de '+who()+'? Esta acción no se puede deshacer.')){data[who()]=[];save();render()}}}
}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));$('#profile').addEventListener('change',render);render();
if('serviceWorker'in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
